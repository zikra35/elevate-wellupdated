# Railway deploys only the Express backend in backend/.
# Set MONGODB_URI, JWT_SECRET (and optionally CORS_ORIGINS, OPENAI_API_KEY) in Railway Variables.
[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install"

[deploy]
startCommand = "node backend/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
